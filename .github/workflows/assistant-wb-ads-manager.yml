name: TOPFACE WB Ads Manager

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"  # 06:00 МСК

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      YC_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
      YC_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
      YC_BUCKET_NAME: ${{ secrets.YC_BUCKET_NAME }}
      WB_PROMO_KEY_TOPFACE: ${{ secrets.WB_PROMO_KEY_TOPFACE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl xlsxwriter requests boto3 python-dateutil numpy pytz

      - name: Verify secrets
        run: |
          python - <<'PY'
          import os

          required = [
              "YC_ACCESS_KEY_ID",
              "YC_SECRET_ACCESS_KEY",
              "YC_BUCKET_NAME",
              "WB_PROMO_KEY_TOPFACE",
          ]

          missing = [name for name in required if not os.getenv(name)]
          if missing:
              raise SystemExit("Missing secrets: " + ", ".join(missing))

          print("All required secrets are present.")
          PY

      - name: Verify script
        run: |
          echo "=== Script info ==="
          pwd
          ls -lh ./assistant_wb_ads_manager.py
          grep -n "SCRIPT_VERSION" ./assistant_wb_ads_manager.py || true
          sha256sum ./assistant_wb_ads_manager.py

          if grep -q "dayfirst=True" ./assistant_wb_ads_manager.py; then
            echo "ERROR: В корне репозитория старая версия assistant_wb_ads_manager.py"
            exit 1
          fi

          if ! grep -q "SCRIPT_VERSION" ./assistant_wb_ads_manager.py; then
            echo "ERROR: В assistant_wb_ads_manager.py нет SCRIPT_VERSION"
            exit 1
          fi

      - name: Compile script
        run: |
          python -m py_compile ./assistant_wb_ads_manager.py

      - name: Run TOPFACE WB Ads Manager
        run: |
          python ./assistant_wb_ads_manager.py run
