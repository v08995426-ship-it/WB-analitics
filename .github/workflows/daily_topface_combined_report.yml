name: TOPFACE management report

on:
  workflow_dispatch:
    inputs:
      send_telegram:
        description: 'Send PDF to Telegram'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      no_pdf:
        description: 'Skip PDF generation'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  schedule:
    # 06:00 Moscow time = 03:00 UTC
    - cron: '0 3 * * *'

jobs:
  build-report:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      YC_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
      YC_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
      YC_BUCKET_NAME: ${{ secrets.YC_BUCKET_NAME }}
      YC_ENDPOINT_URL: ${{ secrets.YC_ENDPOINT_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
      WB_MAX_SEARCH_QUERY_FILES: '8'
      WB_MAX_ENTRY_POINT_FILES: '8'
      WB_MAX_STOCK_FILES: '10'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run TOPFACE report
        shell: bash
        run: |
          ARGS="--root ."
          if [[ "${{ github.event.inputs.no_pdf || 'false' }}" == "true" ]]; then
            ARGS="$ARGS --no-pdf"
          fi
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event.inputs.send_telegram || 'true' }}" == "true" ]]; then
            ARGS="$ARGS --send-telegram"
          fi
          python wb_combined_report_final.py $ARGS

      - name: Upload report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: topface-management-report
          path: |
            Отчёты/Объединенный отчет/TOPFACE/**/*.xlsx
            Отчёты/Объединенный отчет/TOPFACE/**/*.pdf
          if-no-files-found: error
          retention-days: 30
